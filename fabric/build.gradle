plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

repositories {
    maven { url = "https://maven.blamejared.com/" }
    maven { url = "https://maven.ladysnake.org/releases" }
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://maven.terraformersmc.com/releases" }
    maven { url = 'https://maven.ladysnake.org/releases' }
    maven { url = "https://maven.architectury.dev/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    modImplementation "net.fabricmc:fabric-language-kotlin:${fabric_kotlin_version}"

    modApi "com.terraformersmc:modmenu:$modmenu_version"
    modLocalRuntime "org.ladysnake.cardinal-components-api:cardinal-components-base:$cardinal_components_version"
    modLocalRuntime "org.ladysnake.cardinal-components-api:cardinal-components-entity:$cardinal_components_version"
    modLocalRuntime "org.ladysnake.cardinal-components-api:cardinal-components-block:$cardinal_components_version"
    modLocalRuntime "org.ladysnake.cardinal-components-api:cardinal-components-item:$cardinal_components_version"
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:$cloth_config_version"
    modLocalRuntime "com.samsthenerd.inline:inline-fabric:$minecraft_version-$inline_version"
    modImplementation "vazkii.patchouli:Patchouli:$minecraft_version-$patchouli_version-FABRIC"
    // modLocalRuntime "at.petra-k.paucal:paucal-fabric-$minecraft_version:$paucal_version"
    modLocalRuntime files("${rootProject.rootDir}/libs/paucal-$paucal_version+$minecraft_version-fabric.jar")
    modImplementation files("${rootProject.rootDir}/libs/hexcasting-fabric-$minecraft_version-${hexcasting_version}.jar")

    // HexDebug: The Splicing Table offers a casting interface which we should also account for.
    // modApi "gay.object.hexdebug:hexdebug-fabric:$hexdebug_version+$minecraft_version"

    modLocalRuntime "dev.architectury:architectury-fabric:$architectury_version"
}

loom {
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}
